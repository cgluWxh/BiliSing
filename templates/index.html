<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>BiliSing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='bilising.user.js') }}"></script>
</head>

<body>
    <div class="container">
        <div id="error-container"></div>
        <div id="join-section">
            <div class="header">
                <h1>🎤 BiliSing</h1>
                <p><a href="https://github.com/cgluWxh/BiliSing/blob/main/CHANGELOG.md" target="_blank">v2.0</a> by cgluWxh with ❤️. <a href="https://github.com/cgluWxh/BiliSing/blob/main/TERMS_AND_PRIVACY.md" target="_blank">用户条款 & 隐私政策</a></p>
                <p>播放端下载 (点歌无须安装): <a href="/static/BiliSing_2.0.apk" target="_blank">Android App</a> | <a href="https://apps.apple.com/cn/app/bilising/id6749165474" target="_blank">App Store</a> | <a href="/static/bilising.user.js" target="_blank">电脑端 (请先在浏览器中安装 Tampermonkey / 篡改猴)</a></p>
            </div>
            <div class="join-form">
                <input type="text" id="room-id" placeholder="房间ID" required>
                <select id="user-type">
                    <option value="slave" selected>点歌设备</option>
                    <option value="master">播放设备</option>
                </select>
                <input type="text" id="user-name" placeholder="用户名" required>
                <button class="master-options" onclick="joinRoom(false, 'plugin')" style="background-color: #fb7299;">🧩 通过插件播放 (高清)</button>
                <button class="master-options" onclick="joinRoom(false, 'web')" style="background-color: #00aeec;">🌐 直接通过网页播放 (标清)</button>
                <button class="normal-options" onclick="joinRoom()">加入房间</button>
                <button class="normal-options" onclick="joinRoom(true)">匿名加入</button>
            </div>
        </div>

        <div id="room-section" class="room-info">
            <!-- Master视图 -->
            <div id="master-view" class="master-view">
                <div id="masterInfo">
                    <span id="next-song-info">
                        <span>⏭️ 下一首：</span>
                        <span id="next-song-content">暂无歌曲</span>
                    </span>
                    <span style="color:#8fa7b3;" onclick="playNextSong()">⏭️ 切歌</span>
                </div>
                <div class="video-container">
                    <div id="video-player"></div>
                </div>
            </div>

            <!-- Slave视图 -->
            <div id="slave-view" class="slave-view">
                <div id="basicInfo">
                    <div id="current-song-info" class="song-card">
                        <h4>🎶 正在播放：</h4>
                        <div id="current-song-content">暂无歌曲</div>
                    </div>

                    <div class="add-song">
                        <h3>🎵 添加歌曲</h3>
                        <div class="add-song-search-row">
                            <button onclick="openSearchModal()">🔍 搜索哔哩哔哩</button>
                        </div>
                        <div class="add-song-divider"><span>或</span></div>
                        <div class="add-song-input-row">
                            <input type="text" id="bilibili-url" placeholder="🔗 粘贴哔哩哔哩分享链接">
                            <button id="add-song-btn" onclick="addSong()">➕</button>
                        </div>
                    </div>

                    <!-- 播放列表 -->
                    <button class="next-song-btn" onclick="playNextSong()">⏭️ 播放下一首</button>
                    <div class="playlist">
                        <h3 style="display: inline-block;">📋 播放列表 <span id="estimated-duration"></span></h3><button style="margin-left: .8em; display: inline-block;" onclick="requestPlaylistUpdate()">🔄</button>
                        <div id="playlist-container">
                            <p>暂无歌曲</p>
                        </div>
                    </div>
                </div>

                <div id="extraInfo">

                    <!-- 已播放歌曲列表 -->
                    <div class="playlist">
                        <h3>✅ 已播放歌曲</h3>
                        <div id="played-songs-container">
                            <p>暂无已播放歌曲</p>
                        </div>
                    </div>

                    <!-- 聊天区域 -->
                    <div class="chat-section">
                        <h3>💬 消息</h3>
                        <div id="chat-messages" class="chat-messages">
                            <p>暂无消息</p>
                        </div>
                        <div class="chat-input">
                            <input type="text" id="chat-message-input" placeholder="💭 输入消息..." maxlength="200">
                            <button onclick="sendMessage()">📤 发送</button>
                        </div>
                    </div>
                    
                    
                </div>
            </div>
        </div>
    </div>

    <!-- 哔哩哔哩搜索 Modal -->
    <div id="bili-search-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3>🔍 搜索哔哩哔哩</h3>
                <button class="modal-close" onclick="closeSearchModal()">✕</button>
            </div>
            <div class="modal-search-row">
                <div class="search-input-wrap">
                    <input type="text" id="bili-search-input" placeholder="输入关键词..." autocomplete="off">
                    <div id="bili-suggest-list" class="suggest-list"></div>
                </div>
                <button onclick="doSearch()">搜索</button>
            </div>
            <div class="modal-body">
                <div id="bili-search-results"></div>
                <div id="bili-detail-panel" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>

</html>
