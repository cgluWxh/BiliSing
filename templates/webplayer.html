<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="referrer" content="no-referrer">
    <title>BiliSing Web Player</title>
    <script src="/static/bilising.user.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }

        /* 保证视频显示面积最大化 */
        #player-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 满屏比例最大化包含 */
            outline: none;
            border: none;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <video id="videoElement" controls autoplay playsinline></video>
    </div>

    <script>
        window.__BILISING_WEBPLAYER__ = true;
        window.__BILISING_ROOM_ID__ = "{{ room_id }}";
    </script>
</body>
</html>
